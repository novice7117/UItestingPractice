
name: macOS UI Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  ui-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and Run UI Tests
        run: |
          xcodebuild test \
            -project UItestingPractice.xcodeproj \
            -scheme UItestingPractice \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult
